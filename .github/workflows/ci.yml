name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check-release-automation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check release shell scripts
        run: |
          for script in .github/scripts/*.sh; do
            bash -n "$script"
          done
          for script in .github/scripts/*.mjs; do
            node --check "$script"
          done

      - name: Test release provenance guards
        run: ./.github/scripts/test-release-provenance.sh

      - name: Test release finalization guards
        run: ./.github/scripts/test-release-finalization-guards.sh

      - name: Test RPM verifier with a published signed package
        env:
          RPM_X86_64_SHA256: b92fcd554f60543544db26256d7d15317ea8dd60c71ffed37c797c2caba4d036
          RPM_AARCH64_SHA256: 06740462213fa1c3852ad0343863a31e5d167a943797aa9ecb76c5462d08237c
          KEY_SHA256: 6b7c69cf0c711768f457dc4bf40b9dcce0c6f59f0896f55ec826e5fd684f812f
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
          work_dir="$(mktemp -d "$RUNNER_TEMP/opentypeless-rpm-test.XXXXXX")"
          rpm_x86_64="$work_dir/OpenTypeless-1.1.59-1.x86_64.rpm"
          rpm_aarch64="$work_dir/OpenTypeless-1.1.59-1.aarch64.rpm"
          key_path="$work_dir/OpenTypeless-Linux-x86_64-GPG-KEY.asc"
          curl --fail --location --retry 3 \
            --output "$rpm_x86_64" \
            https://github.com/tover0314-w/opentypeless/releases/download/v1.1.59/OpenTypeless-1.1.59-1.x86_64.rpm
          curl --fail --location --retry 3 \
            --output "$rpm_aarch64" \
            https://github.com/tover0314-w/opentypeless/releases/download/v1.1.59/OpenTypeless-1.1.59-1.aarch64.rpm
          curl --fail --location --retry 3 \
            --output "$key_path" \
            https://github.com/tover0314-w/opentypeless/releases/download/v1.1.59/OpenTypeless-Linux-x86_64-GPG-KEY.asc
          printf '%s  %s\n' "$RPM_X86_64_SHA256" "$rpm_x86_64" | sha256sum --check --strict
          printf '%s  %s\n' "$RPM_AARCH64_SHA256" "$rpm_aarch64" | sha256sum --check --strict
          printf '%s  %s\n' "$KEY_SHA256" "$key_path" | sha256sum --check --strict
          ./.github/scripts/verify-rpm-signatures.sh "$key_path" "$rpm_x86_64" "$rpm_aarch64"

      - name: Check release workflows
        env:
          ACTIONLINT_VERSION: '1.7.7'
          ACTIONLINT_SHA256: '023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757'
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --retry 3 \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" .github/workflows/*.yml

  check-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint src/
      - run: npx prettier --check src/
      - run: npx vitest run

  check-rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            platform_group: windows
            target: x86_64-pc-windows-msvc
          - platform: macos-latest
            platform_group: macos
            target: aarch64-apple-darwin
          - platform: ubuntu-latest
            platform_group: linux
            target: x86_64-unknown-linux-gnu
          - platform: ubuntu-22.04-arm
            platform_group: linux
            target: aarch64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.platform_group == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libxdo-dev

      - name: Verify bundled Opus build tool
        run: cmake --version

      - name: Test Linux AppImage packaging guards
        if: matrix.platform_group == 'linux'
        run: ./.github/scripts/test-linux-appimage-packaging.sh

      - run: cargo fmt --check --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --target ${{ matrix.target }} --manifest-path src-tauri/Cargo.toml -- -D warnings
      - name: Run Rust tests
        run: cargo test --target ${{ matrix.target }} --manifest-path src-tauri/Cargo.toml

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: 'npm'

      - run: npm audit --audit-level=high

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      # wayland-scanner 0.31.10 is currently the latest release and still pins
      # quick-xml 0.39 for Wayland protocol code generation. The vulnerable XML
      # parser path is not used for runtime user input; remove these ignores once
      # wayland-scanner publishes a quick-xml >=0.41 compatible release.
      - run: cargo audit --file src-tauri/Cargo.lock --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195
