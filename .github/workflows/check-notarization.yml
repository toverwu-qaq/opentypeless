name: Windows Core Input Verification

on:
  push:
    branches:
      - 'test/windows-local-*'
  workflow_dispatch:
    inputs:
      submission_id:
        description: 'Unused compatibility input; this branch only builds Windows'
        required: false
        default: 'windows-test-only'

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Verify tools
        shell: pwsh
        run: |
          node --version
          rustc --version
          cargo --version
          cmake --version
          rustup target add x86_64-pc-windows-msvc
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Run strict Windows Clippy
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path windows-verification | Out-Null
          cargo test --locked --target x86_64-pc-windows-msvc --manifest-path src-tauri/Cargo.toml --test keyboard_progress -- --test-threads=2 2>&1 | Tee-Object windows-verification/keyboard-progress-tests.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup component add clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked --all-targets --target x86_64-pc-windows-msvc --manifest-path src-tauri/Cargo.toml -- -D warnings 2>&1 | Tee-Object windows-verification/windows-clippy.txt
          $result = $LASTEXITCODE
          "Source: $env:GITHUB_SHA; includes Windows native timer repair. This run does not build a replacement installer." | Set-Content windows-verification/BUILD-INFO.txt
          exit $result
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: OpenTypeless-windows-core-verification
          path: windows-verification/
          retention-days: 7
          if-no-files-found: error
